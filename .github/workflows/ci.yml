name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CW_SKIP_ADOPTION_MATRIX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Install and set up project
        run: npm run setup --if-present

      - name: Install the Laravel app (web/)
        run: npm run setup:web

      - name: Verify project
        run: npm run check

      - name: Verify architecture
        run: npm run check-arch
